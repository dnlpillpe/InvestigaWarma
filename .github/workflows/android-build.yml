name: Android CI - InvestigaWarma

# Este workflow se ejecuta en la infraestructura de GitHub Actions, que sí tiene
# acceso a Internet y al Android SDK/Google Maven. El entorno de generación de
# este proyecto NO tenía esos accesos, por lo que la compilación no pudo
# verificarse localmente (ver docs/BUILD_REPORT.md). Al hacer push de este
# repositorio a GitHub, este workflow compilará y probará la app de verdad.

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    name: Compilar, probar y generar APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cachear dependencias de Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Dar permisos de ejecución a gradlew
        run: chmod +x gradlew

      - name: Limpiar
        run: ./gradlew clean

      - name: Ejecutar pruebas unitarias (testDebugUnitTest)
        run: ./gradlew testDebugUnitTest

      - name: Publicar resultados de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/reports/tests/testDebugUnitTest

      - name: Analizar con Lint (lintDebug)
        run: ./gradlew lintDebug

      - name: Publicar reporte de Lint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html

      - name: Generar APK de depuración (assembleDebug)
        run: ./gradlew assembleDebug

      - name: Publicar APK generado
        uses: actions/upload-artifact@v4
        with:
          name: InvestigaWarma-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
